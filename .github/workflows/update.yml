name: Update Saudi Recruitment Ads

on:
  schedule:
    - cron: '0 */4 * * *' # يتم جلب التحديثات كل 4 ساعات تلقائياً
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 flask

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add recruitment.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Saudi recruitment database [skip ci]" && git push)
