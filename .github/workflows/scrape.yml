name: Auto Scrape and Update

on:
  schedule:
    # يتم تشغيل السكربت تلقائياً كل ساعة
    - cron: '0 * * * *'
  workflow_dispatch: # تتيح لك تشغيله يدوياً في أي وقت

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python script
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add index.html recruitment.db
          git diff --quiet && git diff --cached --quiet || (git commit -m "Update ads automatically [skip ci]" && git push)

