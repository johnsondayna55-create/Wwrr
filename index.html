<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعلانات الاستقدام والتنازل المصفاة</title>
    <style>
        :root { --primary: #1a365d; --accent: #2b6cb0; --bg: #f7fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg); padding: 20px; color: #2d3748; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; }
        header { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; padding: 24px; text-align: center; }
        .filters { padding: 15px 20px; background: #fff; border-bottom: 1px solid #e2e8f0; }
        .search-box { width: 100%; padding: 10px 15px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem; outline: none; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 18px; border-bottom: 1px solid #f1f5f9; text-align: right; vertical-align: top; }
        th { background: #f8fafc; font-weight: 600; color: #475569; }
        .source-tag { background: #ebf8ff; color: #2b6cb0; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
        .category { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .cat-تنازل { background: #c6f6d5; color: #276749; }
        .cat-استقدام { background: #bee3f8; color: #2a4365; }
        footer { text-align: center; padding: 15px; color: #a0aec0; font-size: 0.8rem; background: #f8fafc; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>لوحة إعلانات الاستقدام والتنازل</h1>
            <p>محدثة بشكل دائم لعروض العمالة والتنازل</p>
        </header>
        <div class="filters">
            <input type="text" class="search-box" id="searchInput" placeholder="ابحث برقم، مهنة، أو مدينة...">
        </div>
        <table>
            <thead>
                <tr>
                    <th style="width: 20%;">المصدر</th>
                    <th style="width: 15%;">الفئة</th>
                    <th style="width: 50%;">نص الإعلان</th>
                    <th style="width: 15%;">التاريخ</th>
                </tr>
            </thead>
            <tbody id="adsTable">
                <!-- سيتم تحديث الإعلانات هنا تلقائياً -->
                <tr>
                    <td><span class="source-tag">تليجرام</span></td>
                    <td><span class="category cat-تنازل">تنازل</span></td>
                    <td>متوفر عاملة منزلية للتنازل نقل كفالة فوري.</td>
                    <td>2026-08-29</td>
                </tr>
            </tbody>
        </table>
        <footer>نظام إدارة الإعلانات الآلي</footer>
    </div>
    <script>
        const searchInput = document.getElementById('searchInput');
        const rows = document.querySelectorAll('#adsTable tr');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
